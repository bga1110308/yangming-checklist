<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A051 無紙化點班</title>
<meta name="description" content="A051 病房六張點班表的無紙化試用版">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='2' width='18' height='20' rx='4' fill='%230c676c'/%3E%3Cpath d='M8 12l3 3 5-6' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  /* 基本重設：跟試用版在 claude.ai 上的外框一致 */
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main id="view"><h1 class="page">本班點班</h1><p class="empty">正在載入大家的點班紀錄…</p></main>
<nav class="tabs"><div class="tabs-in">
  <button data-tab="home" id="tab-home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v2h6V3M9 11l2 2 4-4M9 17h6"/></svg>點班</button>
  <button data-tab="overview" id="tab-overview"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h2M14 13h2M8 17h2M14 17h2"/></svg>護理長總覽</button>
  <button data-tab="settings" id="tab-settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>基本量設定</button>
</div></nav>
<div id="foot"></div>
<div class="sheet" id="sheet" hidden><div class="sheet-in">
  <h3>誰在點班？</h3>
  <input class="field" id="nq" placeholder="打姓名或學程，例：陳、臨護所" autocomplete="off">
  <div class="nlist" id="nlist"></div>
  <button class="danger" id="nclose" style="border-color:var(--line);color:var(--muted)">取消</button>
</div></div>
<div class="toast" id="toast" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
